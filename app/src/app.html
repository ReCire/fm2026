<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Both themes, and both declared.

      This was one fixed dark `theme-color` and `color-scheme: dark`, while the
      app ships a full parchment light mode. On a phone that means the browser
      chrome above the page stays night-dark against a cream screen, and every
      native control the OS draws — scrollbars, date pickers, form widgets —
      renders dark on light. `theme.svelte.ts` also rewrites the tag when the
      player picks a theme explicitly, since a media query cannot see a choice
      stored in localStorage.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141F1A" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFDF7" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Anstoß" />
    <script>
      /*
       * Runs before first paint so the page never flashes the wrong theme.
       * Inline on purpose: a module import would resolve after the first frame.
       * `system` leaves the attribute off so the media query stays live.
       */
      try {
        var t = localStorage.getItem('anstoss:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
